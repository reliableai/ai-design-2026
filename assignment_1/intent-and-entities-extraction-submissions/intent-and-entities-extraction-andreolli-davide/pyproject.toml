[project]
name = "review-judge-tool"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.66.0",
    "pandas>=2.0.0",
    "datasets>=2.18.0",
    "kaggle>=1.6.0",
    "litellm>=1.0.0",
    "instructor>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "textual[dev]",
]

[project.scripts]
review-judge = "src.tui.app:main"
